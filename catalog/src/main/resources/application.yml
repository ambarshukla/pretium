server:
  port: 8082

spring:
  application:
    name: pretium-catalog
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pretium}
    username: ${DB_USER:pretium}
    password: ${DB_PASSWORD:pretium}
    hikari:
      maximum-pool-size: 5
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: pretium-catalog
      # A new consumer group starts from the beginning of each topic, so a fresh
      # catalog rebuilds itself from Kafka.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      max-poll-records: 1000

pretium:
  reconcile:
    # The euro reference rates the benchmark and cross rates are computed from.
    reference: ecb-sdmx-exr
    # Each publisher's reference channel, and the channels checked against it.
    groups:
      ecb-sdmx-exr: [ecb-eurofxref-daily, ecb-reference-html]
      cnb-fixing-txt: [cnb-fixing-html]
  # Freshness targets. ECB rates are published on TARGET business days only, so a
  # Monday morning is legitimately three days after Friday's rates: 96 hours
  # covers a weekend plus one holiday.
  freshness:
    ecb-sdmx-exr: 96h
    ecb-eurofxref-daily: 96h
    ecb-reference-html: 96h
    # The CNB fixes on Czech working days; the same weekend-plus-holiday allowance.
    cnb-fixing-txt: 96h
    cnb-fixing-html: 96h
    # Weekly check of a quarterly dataset.
    wb-rpw: 8d

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
