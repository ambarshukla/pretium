# Local infrastructure for development: Postgres and a single Kafka broker.
# The services themselves run from Gradle (make run-collector / make run-catalog)
# so that a code change is a restart, not an image build.
#
# Kafka 4.x runs in KRaft mode only (the broker is its own controller), which
# is why there is no ZooKeeper here.
name: pretium-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pretium
      POSTGRES_PASSWORD: pretium
      POSTGRES_DB: pretium
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pretium -d pretium"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.1.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      # One broker, so internal topics cannot be replicated more than once.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Off deliberately: a misspelt topic should fail, not silently appear.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    volumes:
      - kafka-data:/var/lib/kafka/data

  # Metrics, off by default: start with `docker compose --profile metrics up -d`.
  # Both services run from Gradle on the host, so Prometheus reaches them at
  # host.docker.internal. Grafana is at http://localhost:3001 (anonymous viewer).
  prometheus:
    profiles: [metrics]
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 256m

  grafana:
    profiles: [metrics]
    image: grafana/grafana:12.2.0
    ports:
      - "3001:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # Open straight on the pretium dashboard rather than Grafana's empty home page.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/pretium-overview.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
    mem_limit: 384m

volumes:
  postgres-data:
  kafka-data:
