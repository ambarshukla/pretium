# Scrapes the two services' /actuator/prometheus endpoints every 15 seconds.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: pretium-collector
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8091"]
  - job_name: pretium-catalog
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8082"]
